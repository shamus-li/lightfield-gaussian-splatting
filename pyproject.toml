[project]
name = "lightfield-gaussian-splatting"
version = "0.1.0"
description = "Training and evaluation code for light-field Gaussian splatting"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "addict>=2.4.0",
  "diff-gaussian-rasterization",
  "fused-ssim @ git+https://github.com/rahul-goel/fused-ssim.git@328dc9836f513d00c4b5bc38fe30478b4435cbb5",
  "gsplat==1.5.3",
  "imageio[ffmpeg]>=2.35.1",
  "lpips>=0.1.4",
  "numpy>=1.22.4,<2",
  "opencv-python>=4.10.0",
  "openexr>=3.3",
  "pillow>=10.4.0",
  "plotly>=5.24.0",
  "plyfile>=1.1",
  "pycolmap==3.10.0",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.3.0",
  "setuptools==75.3.4",
  "simple-knn",
  "torch==2.1.2",
  "torchvision==0.16.2",
  "tqdm>=4.66.0",
]

[project.urls]
"Project page" = "https://shamus.li/lightfield-gaussian-splatting/"

[tool.uv.extra-build-dependencies]
diff-gaussian-rasterization = ["torch==2.1.2", "setuptools==75.3.4"]
fused-ssim = ["torch==2.1.2", "setuptools==75.3.4"]
simple-knn = ["torch==2.1.2", "setuptools==75.3.4"]

[tool.uv.sources]
diff-gaussian-rasterization = { path = "submodules/diff-gaussian-rasterization" }
simple-knn = { path = "submodules/simple-knn" }

[tool.uv]
package = false

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "ty>=0.0.1a14",
  "vulture>=2.14",
]

[tool.ruff]
line-length = 100
extend-exclude = ["submodules"]

[tool.ty.src]
exclude = [
  "submodules/**",
]
