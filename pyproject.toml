[project]
name = "lightfield-gaussian-splatting"
version = "0.1.0"
description = "Training and evaluation code for light-field Gaussian splatting"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "addict>=2.4.0",
  "fused-ssim @ git+https://github.com/rahul-goel/fused-ssim.git@a7c48d6dd7ac6dc39a7958c7c4452e0b10418f38",
  "gsplat>=1.5.3",
  "hydra-core>=1.3.8",
  "imageio[ffmpeg]>=2.38",
  "kornia>=0.9",
  "lightglue @ git+https://github.com/jytime/LightGlue.git@2f23ca2ea9638cecad7f7220795210fc6b8353c3",
  "lpips>=0.1.4",
  "numpy>=2.5",
  "opencv-python>=5",
  "openexr>=3.5",
  "pillow>=13",
  "plyfile>=1.1",
  "pycolmap>=4.2.1",
  "pyyaml>=6.0.3",
  "scikit-learn>=1.9",
  "scipy>=1.18",
  "setuptools>=84",
  # The newest torch with a CUDA 12 build; gsplat and fused-ssim compile against the
  # CUDA 12.8 toolkit on the cluster nodes.
  "torch==2.14.1",
  "torchvision==0.29.1",
  "tqdm>=4.70",
  "trimesh>=5.2",
  "tyro>=1.0",
  "vggt",
]

[project.urls]
"Project page" = "https://shamus.li/lightfield-gaussian-splatting/"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
vggt = { path = "submodules/vggt", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.extra-build-dependencies]
fused-ssim = [{ requirement = "torch", match-runtime = true }, "setuptools"]

[tool.uv]
package = false
# VGGT declares numpy<2 but runs on NumPy 2.
override-dependencies = ["numpy>=2.5"]

[project.optional-dependencies]
dev = [
  "ruff>=0.17",
  "ty>=0.0.99",
  "vulture>=2.16",
]

[tool.ruff]
line-length = 100
extend-exclude = ["submodules"]

[tool.ty.src]
exclude = [
  "submodules/**",
]
